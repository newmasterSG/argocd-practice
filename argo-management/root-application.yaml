apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: declarative-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/newmasterSG/argocd-practice.git
    targetRevision: HEAD
    path: my-app

    helm:
     valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true