apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: declarative-nginx-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/newmasterSG/argocd-practice.git
    targetRevision: HEAD
    path: my-app

    helm:
     valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
     namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: declarative-nginx-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/newmasterSG/argocd-practice.git
    targetRevision: HEAD
    path: my-app

    helm:
     valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true